[package]
name = "droidpods"
description = "DroidPods — AirPods companion for Linux and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aacp.workspace = true
droidpods-core.workspace = true
tokio.workspace = true
log.workspace = true
env_logger.workspace = true
dark-light = "2.0"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030"] }

[target.'cfg(target_os = "linux")'.dependencies]
droidpods-linux.workspace = true
bluer = { version = "0.17", features = ["bluetoothd"] }

[build-dependencies]
slint-build = "1.18"
