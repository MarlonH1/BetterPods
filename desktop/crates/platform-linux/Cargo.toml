[package]
name = "betterpods-linux"
description = "Linux platform layer for BetterPods: BlueZ L2CAP transport and device discovery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aacp.workspace = true
betterpods-core.workspace = true
tokio.workspace = true
log.workspace = true
bluer = { version = "0.17", features = ["bluetoothd", "l2cap"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
ksni = { version = "0.3.7", default-features = false, features = ["tokio"] }
notify-rust = { version = "4.18.2", default-features = false, features = ["z"] }
resvg = { version = "0.49.0", default-features = false }
futures-util = { version = "0.3.34", default-features = false }

[dev-dependencies]
env_logger.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
